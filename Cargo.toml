[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
shattr-core = { path = "crates/shattr-core" }
shattr-library = { path = "crates/shattr-library" }
shattr-ui = { path = "crates/shattr-ui" }
shattr-annotate = { path = "crates/shattr-annotate" }
shattr-editor = { path = "crates/shattr-editor" }

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
