[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
sukurin-core = { path = "crates/sukurin-core" }
sukurin-library = { path = "crates/sukurin-library" }
sukurin-ui = { path = "crates/sukurin-ui" }
sukurin-annotate = { path = "crates/sukurin-annotate" }
sukurin-editor = { path = "crates/sukurin-editor" }

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"
